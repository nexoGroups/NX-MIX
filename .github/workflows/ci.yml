name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build NxMix.slnx -c Release
      # Echtzeit-Tests (zwei Threads, keine Allokation im Audio-Pfad) brauchen freie Kerne: Testklassen nacheinander
      - name: Test
        run: dotnet test NxMix.slnx -c Release --no-build --filter "Category!=Performance&Category!=Hardware" -- RunConfiguration.DisableParallelization=true
      - name: Headless UI & Invariants Self-Test
        shell: pwsh
        run: |
          dotnet src/NxMix.App/bin/Release/net10.0-windows/NX-MIX.dll --selftest artifacts/selftest.log
          $ec = $LASTEXITCODE
          Get-Content artifacts/selftest.log
          if ($ec -ne 0) { throw "SelfTest failed with exit code $ec" }
