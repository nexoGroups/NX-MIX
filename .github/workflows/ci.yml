name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build NxMix.slnx -c Release
      - name: Test
        run: dotnet test NxMix.slnx -c Release --no-build --filter "Category!=Performance"
